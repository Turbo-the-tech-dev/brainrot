name: Triage Labeler
on:
  issues:
    types: [opened, edited]
jobs:
  label_and_assign:
    runs-on: ubuntu-latest
    steps:
      - name: Label based on keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];
            if (title.includes('bug')) labels.push('bug');
            if (title.includes('security') || title.includes('hardening')) labels.push('security');
            if (title.includes('perf')) labels.push('performance');
            if (title.includes('docs')) labels.push('documentation');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
      - name: Auto-assign to Maintainer
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [context.repo.owner]
            });
