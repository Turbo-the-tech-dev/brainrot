name: Greetings
on:
  issues:
    types: [opened]
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Thanks for opening this issue! Our Triage Bot has assigned this for review. Please ensure you have followed the guidelines in CONTRIBUTING.MD."
            })
